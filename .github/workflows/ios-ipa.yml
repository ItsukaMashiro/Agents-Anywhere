name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "iOS deployment target (minimum OS the IPA will run on)"
        default: "26.0"
        required: false

jobs:
  build:
    name: Build unsigned IPA for iOS
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build for iOS (device)
        run: |
          xcodebuild \
            -project "ios/Agents Anywhere/Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET="${{ inputs.deployment_target || '26.0' }}"

      - name: Package the IPA
        run: |
          echo "--- built products ---"
          ls -la build/Build/Products/Release 2>/dev/null || true
          APP="$(find build/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)"
          if [ -z "${APP}" ]; then
            APP="$(find build -name '*.app' -type d | head -1)"
          fi
          if [ -z "${APP}" ]; then
            echo "no .app bundle found"
            exit 1
          fi
          echo "app bundle: ${APP}"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "${APP}" ipa/Payload/
          ( cd ipa && zip -r -q ../agents-anywhere.ipa Payload )
          ls -l agents-anywhere.ipa
          unzip -l agents-anywhere.ipa | head -15

      - name: Report the minimum OS baked into the binary
        run: |
          unzip -o -q agents-anywhere.ipa -d ipa-check
          BIN="$(find ipa-check -name '*.app' -type d | head -1)"
          echo "app: ${BIN}"
          otool -l "${BIN}/$(basename "${BIN}")" | grep -B2 -A6 -E 'LC_BUILD_VERSION|LC_MIN_VERSION' | head -40

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: agents-anywhere-ios-${{ inputs.deployment_target || '26.0' }}
          path: agents-anywhere.ipa
