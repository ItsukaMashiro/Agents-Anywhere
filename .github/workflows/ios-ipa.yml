name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "iOS deployment target (minimum OS the IPA will run on)"
        default: "26.1"
        required: false

jobs:
  build:
    name: Build unsigned IPA for iOS
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Archive for iOS (device)
        run: |
          xcodebuild archive \
            -project "ios/Agents Anywhere/Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -archivePath build/AgentsAnywhere.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET="${{ inputs.deployment_target || '26.1' }}"

      - name: Extract the IPA
        run: |
          echo "--- what xcodebuild produced ---"
          ls -la build
          ARCHIVE="$(find . -name '*.xcarchive' -type d | head -1)"
          echo "archive: ${ARCHIVE}"
          IPA="$(find "${ARCHIVE}" -name '*.ipa' | head -1)"
          if [ -z "${IPA}" ]; then
            IPA="$(find build -name '*.ipa' | head -1)"
          fi
          if [ -z "${IPA}" ]; then
            echo "no .ipa found; falling back to zipping the built .app"
            APP="$(find build/Build/Intermediates.noindex -path '*InstallationBuildProductsLocation*' -name '*.app' -type d | head -1)"
            echo "app: ${APP}"
            ROOT="$(pwd)"
            ( cd "$(dirname "${APP}")" && zip -r -q "${ROOT}/agents-anywhere.ipa" "$(basename "${APP}")" )
          else
            cp "${IPA}" agents-anywhere.ipa
          fi
          ls -l agents-anywhere.ipa

      - name: Report the deployment target baked into the binary
        run: |
          unzip -o -q agents-anywhere.ipa -d ipa-check
          BIN="$(find ipa-check -name '*.app' -type d | head -1)"
          echo "app: ${BIN}"
          otool -l "${BIN}/$(basename "${BIN}")" | grep -A4 -E 'LC_MIN_VERSION|cmd 0x80' | head -30

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: agents-anywhere-ios-${{ inputs.deployment_target || '26.1' }}
          path: agents-anywhere.ipa
